<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cockpit Assistant Personnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0c0c0e; --panel:#16161a; --panel2:#1d1d23; --line:#2a2a31;
    --text:#e9e7e1; --muted:#8b8b93; --gold:#c9a86a; --bronze:#c08a6e;
    --slate:#9aa5b1; --green:#7bb98a; --red:#d08a8a;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;padding:18px 14px 70px}
  .wrap{max-width:960px;margin:0 auto}
  .head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .title{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.5px;line-height:1.05}
  .title span{color:var(--gold)}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .tools{display:flex;gap:6px}
  .tools button{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--sans)}
  .tools button:hover{color:var(--text);border-color:var(--gold)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
  .tabs button{padding:9px 16px;border-radius:22px;white-space:nowrap;cursor:pointer;
    font-weight:600;font-size:13.5px;border:1px solid var(--line);background:transparent;color:var(--text);font-family:var(--sans)}
  .tabs button.on{background:var(--gold);color:#1a1208;border-color:var(--gold)}
  .stitle{font-family:var(--serif);font-size:24px;font-weight:700;margin:0 0 6px}
  .p{color:var(--muted);font-size:13.5px;margin:0 0 14px;line-height:1.5}
  .fb-controls{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .fb-controls button{padding:7px 14px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:600;
    border:1px solid var(--line);background:transparent;color:var(--text);font-family:var(--sans)}
  .fb-controls button.on{background:var(--panel2);border-color:var(--gold);color:var(--gold)}
  .fb-box{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:12.5px;color:var(--muted)}
  .legend .it{display:flex;align-items:center;gap:7px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .sec-head{display:flex;align-items:center;gap:9px;margin:0 0 10px}
  .sec-bar{width:8px;height:22px;border-radius:3px}
  .sec-name{font-family:var(--serif);font-size:22px;font-weight:700}
  .cat{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .cat-head{padding:11px 14px;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cat-add{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;
    padding:4px 9px;font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .cat-add:hover{color:var(--gold);border-color:var(--gold)}
  .task{border-top:1px solid var(--line)}
  .task-row{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .chk{width:20px;height:20px;border-radius:5px;flex:0 0 auto;cursor:pointer;border:1.5px solid var(--line);
    background:transparent;color:#0c0c0e;font-size:13px;line-height:16px;text-align:center}
  .chk.on{background:var(--green);border-color:var(--green)}
  .task-name{flex:1;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;
    font-family:var(--sans);font-size:14px}
  .task-name.done{color:var(--muted);text-decoration:line-through}
  .ptag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
  .ptag.A{background:rgba(123,185,138,.15);color:var(--green)}
  .ptag.B{background:rgba(208,138,138,.15);color:var(--red)}
  .caret{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;transition:.2s}
  .caret.open{transform:rotate(90deg)}
  .task-body{padding:0 12px 14px 42px;display:none;flex-direction:column;gap:8px}
  .task-body.open{display:flex}
  .plan{text-align:left;padding:9px 11px;border-radius:8px;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-family:var(--sans);font-size:13px}
  .plan.on.A{border-color:var(--green);background:rgba(123,185,138,.10)}
  .plan.on.B{border-color:var(--red);background:rgba(208,138,138,.10)}
  .plan .lab{font-weight:700;font-size:12px}
  .plan.A .lab{color:var(--green)} .plan.B .lab{color:var(--red)}
  .plan .small{color:var(--muted);font-size:12px}
  .note,.cell,select.cell,textarea.note{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;width:100%}
  textarea.note{resize:vertical}
  .del-task{align-self:flex-start;background:none;border:1px solid var(--line);color:var(--red);
    border-radius:7px;padding:3px 9px;font-size:11px;cursor:pointer}
  .rep-form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .btn{padding:9px 20px;border-radius:22px;border:none;background:var(--gold);color:#1a1208;
    font-weight:700;font-family:var(--sans);font-size:13.5px;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .rep-cat{color:var(--bronze);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:1px;margin:0 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card .nm{font-weight:600;font-size:14.5px}
  .card .ro{color:var(--muted);font-weight:400;font-size:13px}
  .card .em{color:var(--gold);font-size:13px;word-break:break-all}
  .card .mu{color:var(--muted);font-size:13px}
  .icn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--text);cursor:pointer;padding:4px 9px;font-size:12px}
  .icn.red{color:var(--red)}
  .ob-g{color:var(--gold);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px;margin:0 0 8px}
  .ob-q{font-size:13.5px;margin-bottom:4px}
  .ob-block{margin-bottom:18px}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .ov.on{display:flex}
  .menu{background:var(--panel);border:1px solid var(--gold);border-radius:14px;max-width:430px;width:100%;padding:18px;max-height:88vh;overflow:auto}
  .menu h4{font-family:var(--serif);font-size:20px;font-weight:700;margin:0}
  .menu .cap{color:var(--muted);font-size:12px;margin:2px 0 12px}
  .mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
  .mlab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:10px}
  .mini{padding:7px 13px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:12.5px;font-family:var(--sans)}
  .mini.on{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
  .mini.A.on{border-color:var(--green);color:var(--green)} .mini.B.on{border-color:var(--red);color:var(--red)}
  .mclose{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .mclose button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .actbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:8px}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
  .toggle input{width:16px;height:16px}
  .rolep{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;border:1px solid;background:transparent;white-space:nowrap}
  .senschip{font-size:11px;color:var(--muted);font-weight:400}
  .timep{font-size:11px;color:#c9a86a;border:1px solid #c9a86a;border-radius:10px;padding:0 6px;cursor:default}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}.title{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="title">Cockpit <span>Assistant Personnel</span></div>
      <div class="sub">Workflow Ishikawa hiérarchisé · Plans A/B · Répertoire · Onboarding — sauvegarde locale auto</div>
    </div>
    <div class="tools">
      <button id="exp">Exporter</button>
      <button id="imp">Importer</button>
      <button id="rst">Réinitialiser</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<input type="file" id="file" accept="application/json" style="display:none" />
<div class="ov" id="ov"></div>

<script>
/* ===================== DONNÉES ===================== */
/* Rôles « responsable » — la couleur du fishbone = qui est en charge */
const ROLES = {
  AP:{label:"Assistant personnel (moi)", color:"#c9a86a"},
  HM:{label:"Intendant / House manager", color:"#c08a6e"},
  FO:{label:"Family office", color:"#9aa5b1"},
  EA:{label:"Executive Assistant (corporate)", color:"#d6c68a"},
  CH:{label:"Chef / traiteur", color:"#8fbf8f"},
  DR:{label:"Chauffeur", color:"#7fa8d0"},
  SEC:{label:"Sécurité", color:"#d08a8a"},
  NAN:{label:"Nounou / staff enfants", color:"#c79ad0"},
  PET:{label:"Pet care / vétérinaire", color:"#9fb0a0"},
};
function roleColor(r){ return (ROLES[r]&&ROLES[r].color)||"#8b8b93"; }
function roleLabel(r){ return (ROLES[r]&&ROLES[r].label)||"Non assigné"; }
const SENS = ["🟢 Équipe","🟡 Restreint","🟠 Confidentiel","🔴 Secret"];

/* Arborescence A→N (= la liste de collecte). Chaque section a un rôle + sensibilité par défaut ;
   chaque sous-tâche peut surcharger role/sens. a/b = Plan A (nominal) / Plan B (repli) si pertinent. */
const SECTIONS = [
  { id:"bible", letter:"A", icon:"🗂️", label:"Le Principal — La Bible", role:"AP", sens:"🟡 Restreint", items:[
    { label:"Identité & joignabilité" },
    { label:"Préférences alimentaires (⚠ allergies)" },
    { label:"Garde-robe & style" },
    { label:"Santé & médical", sens:"🔴 Secret" },
    { label:"Habitudes & routines" },
    { label:"Irritants & non-négociables" },
    { label:"Cadeaux & attentions" } ]},
  { id:"gouvernance", letter:"B", icon:"⚖️", label:"Gouvernance & décision", role:"AP", sens:"🟠 Confidentiel", items:[
    { label:"Plafond de dépense autonome", role:"FO" },
    { label:"Décisions seul vs escalade" },
    { label:"Hiérarchie de contact si injoignable" },
    { label:"Coordination des rôles (EA / intendant / FO)" },
    { label:"NDA & règles de discrétion", role:"FO" },
    { label:"Périmètre du poste" },
    { label:"Modalités de reporting" } ]},
  { id:"calendrier", letter:"C", icon:"📅", label:"Agenda & calendrier", role:"AP", sens:"🟡 Restreint", items:[
    { label:"Revue de l'agenda du jour", timing:"Confirmer J-1 (veille 18h) · tampon 30 min entre RDV", a:"Confirmer chaque RDV la veille + créneaux tampon", b:"Relancer sur 2 canaux, report pré-validé" },
    { label:"Confirmation des participants", timing:"Relance J-1 si pas de réponse", a:"Confirmation écrite J-1", b:"Appel direct + assistant du tiers" },
    { label:"Gestion des conflits", a:"Arbitrer selon la matrice de priorité", b:"2 créneaux de report pré-acceptés" },
    { label:"Créneaux sacrés & priorités" },
    { label:"Briefing matinal", timing:"Chaque matin avant 8h", a:"Synthèse en 5 points le matin", b:"Message vocal si en déplacement" } ]},
  { id:"comm", letter:"D", icon:"✉️", label:"Communications & gatekeeping", role:"AP", sens:"🟠 Confidentiel", items:[
    { label:"Tri des emails", timing:"2×/jour (matin + fin d'après-midi)", a:"Classer Urgent/À traiter/Info", b:"Escalader au-delà du seuil" },
    { label:"Liste VIP (jamais filtrer)" },
    { label:"Filtrage appels & messages", a:"Router selon hiérarchie", b:"Message structuré + créneau de rappel" },
    { label:"Correspondance sortante", timing:"Réponse sous 24h", a:"Rédiger puis faire valider", b:"Modèles pré-approuvés" } ]},
  { id:"famille", letter:"E", icon:"👪", label:"Entourage & famille", role:"AP", sens:"🟠 Confidentiel", items:[
    { label:"Fiche conjoint" },
    { label:"Fiches enfants (école, allergies)", role:"NAN", sens:"🔴 Secret" },
    { label:"Occasions & journal des cadeaux", timing:"Anticiper 2-3 sem. · fleurs J-1 avant 16h" },
    { label:"Cercle pro/social clé", role:"EA" } ]},
  { id:"residences", letter:"F", icon:"🏠", label:"Résidences", role:"HM", sens:"🟠 Confidentiel", items:[
    { label:"Calendrier d'occupation" },
    { label:"Staff sur place" },
    { label:"Accès / clés / wifi", role:"SEC", sens:"🔴 Secret" },
    { label:"Inventaires (cave, œuvres, garde-robe)" },
    { label:"Entretien par zone", timing:"Planifier ≥ 1 semaine à l'avance", a:"Prestataires planifiés", b:"Artisan d'urgence pré-référencé" },
    { label:"Fournisseurs & assurances", role:"FO" } ]},
  { id:"staff", letter:"G", icon:"🧑‍🍳", label:"Personnel de maison", role:"HM", sens:"🟠 Confidentiel", items:[
    { label:"Coordination du staff", a:"Planning diffusé + consignes", b:"Agence de remplacement à activer" },
    { label:"Plannings & congés", timing:"Valider le planning chaque dimanche" },
    { label:"Remplacements", timing:"Prévenir l'agence ≥ 48h", a:"Remplaçant identifié", b:"Agence d'astreinte" },
    { label:"Contrats & rémunération", role:"FO", sens:"🔴 Secret" } ]},
  { id:"prestataires", letter:"H", icon:"🤝", label:"Prestataires & fournisseurs", role:"AP", sens:"🟠 Confidentiel", items:[
    { label:"Chauffeur / transport", timing:"Réserver ≥ 12h · brief J-1 · pickup +15 min de marge", role:"DR" },
    { label:"Chef / traiteur", role:"CH", timing:"Commande ≥ 48h pour un dîner" },
    { label:"Fleuriste", timing:"Commander la veille avant 16h" },
    { label:"Pressing / blanchisserie", timing:"Dépôt J-2 pour rendu J", role:"HM" },
    { label:"Sécurité / close protection", role:"SEC" },
    { label:"Conciergerie" },
    { label:"Artisans (plombier, élec…)", role:"HM" },
    { label:"Restaurants habituels", timing:"Réserver ≥ 48h · vérifier la fenêtre d'annulation (souvent J-1)" } ]},
  { id:"vehicules", letter:"I", icon:"🚗", label:"Véhicules", role:"DR", sens:"🟠 Confidentiel", items:[
    { label:"Entretien & contrôle technique", timing:"Programmer 2 semaines avant échéance", a:"Entretien planifié", b:"Véhicule de remplacement" },
    { label:"Assurance", role:"FO" },
    { label:"Chauffeur attitré" },
    { label:"Localisation & carburant" } ]},
  { id:"voyages", letter:"J", icon:"✈️", label:"Voyages", role:"AP", sens:"🟠 Confidentiel", items:[
    { label:"Profil voyage (compagnies/sièges/hôtels)" },
    { label:"Documents & expirations", timing:"Vérifier validité ≥ 3 mois avant départ", sens:"🔴 Secret" },
    { label:"Dossier par déplacement", timing:"Finaliser J-3", a:"Itinéraire confirmé heure par heure", b:"Plan B par segment" },
    { label:"Transferts sol", timing:"Chauffeur réservé J-1 · marge +15 min", role:"DR", a:"Chauffeur briefé", b:"2e chauffeur / VTC premium" },
    { label:"Hébergement", timing:"Vérifier la date limite d'annulation gratuite (souvent J-2/J-3)", a:"Résa confirmée + préférences", b:"Hôtel équivalent pré-réservé" } ]},
  { id:"animaux", letter:"K", icon:"🐾", label:"Animaux", role:"PET", sens:"🟡 Restreint", items:[
    { label:"Vétérinaire & soins", timing:"RDV pris à l'avance · rappels vaccins" },
    { label:"Alimentation", role:"HM" },
    { label:"Garde en l'absence", timing:"Réserver ≥ 1 semaine", role:"HM" },
    { label:"Assurance", role:"FO" } ]},
  { id:"finances", letter:"L", icon:"💳", label:"Finances & administratif", role:"FO", sens:"🔴 Secret", items:[
    { label:"Moyens de paiement (référence, pas le n°)" },
    { label:"Validation des dépenses" },
    { label:"Notes de frais", timing:"Soumettre chaque semaine", role:"AP" },
    { label:"Comptes à surveiller" },
    { label:"Contacts comptable/avocat/banquier" },
    { label:"Échéances récurrentes", timing:"Rappel J-5 avant chaque échéance" } ]},
  { id:"securite", letter:"M", icon:"🔐", label:"Sécurité & accès", role:"SEC", sens:"🔴 Secret", items:[
    { label:"Société de sécurité / close protection" },
    { label:"Détenteurs de clés / codes (valeurs hors outil)" },
    { label:"Procédure d'urgence & évacuation", timing:"Revue trimestrielle", a:"Protocole défini + contacts", b:"Itinéraire/point de repli alternatif" } ]},
  { id:"documents", letter:"N", icon:"📑", label:"Documents & échéances", role:"AP", sens:"🟠 Confidentiel", items:[
    { label:"Suivi expirations (passeports/visas)", timing:"Alertes 6 mois et 3 mois avant · visa: délai 2-6 sem.", sens:"🔴 Secret" },
    { label:"Permis & assurances", role:"FO" },
    { label:"Contrats prestataires", timing:"Revoir 1 mois avant renouvellement", role:"HM" },
    { label:"Rappels automatiques" } ]},
];
const ONBOARDING = [
  { g:"Communication", q:["Canal de contact préféré et horaires où je peux vous joindre ?","Niveau de détail attendu dans mes comptes-rendus, et fréquence ?","Comment préférez-vous être interrompu en cas d'urgence réelle ?"]},
  { g:"Agenda & Priorités", q:["Qui d'autre a accès à votre agenda et peut le modifier ?","En cas de conflit d'agenda, quelle est votre règle de priorité ?","Quels créneaux sont sacrés / à ne jamais réserver ?"]},
  { g:"Pouvoir de décision (clé)", q:["Jusqu'à quel montant puis-je engager une dépense sans validation ?","Quelles décisions puis-je prendre seul, lesquelles escalader ?","Qui contacter si vous êtes injoignable et qu'une décision urgente s'impose ?"]},
  { g:"Voyages", q:["Compagnies, classes, sièges et hôtels préférés ?","Qui gère les réservations et le budget voyage ?","Où sont les documents (passeports, visas) et programmes de fidélité ?"]},
  { g:"Maison & Personnel", q:["Qui compose le personnel de maison et qui le coordonne ?","Contacts clés : gouvernante, chauffeur, chef, sécurité ?","Fournisseurs et prestataires habituels ?"]},
  { g:"Finances & Admin", q:["Quels moyens de paiement sont à ma disposition ?","Circuit de validation des dépenses et notes de frais ?","Quelles échéances récurrentes surveiller ?"]},
  { g:"Famille & Privé", q:["Quels proches dois-je connaître et dont anticiper les besoins ?","Quelles dates importantes (anniversaires, événements récurrents) ?","Quel niveau d'implication dans la sphère privée ?"]},
  { g:"Préférences personnelles", q:["Allergies, restrictions alimentaires, marques/boissons préférées ?","Vos irritants : les choses à ne JAMAIS faire ?","Vos non-négociables au quotidien ?"]},
  { g:"Confidentialité", q:["Quelles informations sont strictement confidentielles ?","Quelles règles de discrétion / NDA respecter ?","Que puis-je / ne puis-je pas communiquer aux tiers ?"]},
  { g:"Urgences", q:["Procédure et hiérarchie de contact en cas d'urgence ?","Coordonnées médicales et personnes à prévenir ?"]},
];
const CONTACT_CATS = ["Personnel de maison","Famille","Prestataires","Professionnel","Voyages","Urgences"];

/* ===================== ÉTAT / STOCKAGE ===================== */
const KEY="pa_cockpit_v1";
let state = load();
function load(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)); if(r) return Object.assign(blank(),r);}catch(e){}
  return blank();
}
function blank(){ return { tab:"workflow", fbView:"all", tasks:{}, custom:{}, contacts:[], answers:{},
  agenda:[], backend:"http://localhost:8787", chat:[], pending:[], team:false }; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} if(state && state.team) schedulePush(); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* sous-tâches d'une section = prédéfinies + custom, avec héritage rôle/sensibilité */
function catTasks(sec){
  const base = sec.items.map((t,i)=>({ ...t, id:`${sec.id}-${i}`, role:t.role||sec.role, sens:t.sens||sec.sens }));
  const cust = (state.custom[sec.id]||[]).map(t=>({ ...t, custom:true, role:t.role||sec.role, sens:t.sens||sec.sens }));
  return base.concat(cust);
}
function ts(id){ return state.tasks[id] || {done:false,active:null,note:""}; }

/* ===================== FISHBONE (hiérarchique) ===================== */
function buildFishbone(view){
  const cats=[];
  SECTIONS.forEach(s=>{ if(view==="all"||view===s.id) cats.push(s); });
  if(state.agenda && state.agenda.length && view==="all"){
    const evs=state.agenda.map((e,i)=>({ id:"agenda-"+i, label:(fmtTime(e.start)+" "+(e.title||"")).trim(), _event:true, role:"AP" }));
    cats.unshift({ id:"agenda", icon:"📆", label:"Agenda du jour", role:"AP", _agenda:true, items:evs });
  }
  const detailed = view!=="all";
  const n=cats.length || 1;
  const btnW = detailed?185:152;
  const btnH = 24;
  const stub = 16;
  const gap  = 33;                              // espacement vertical entre boutons
  const slot = detailed?380:255;
  const headPad=210;
  const itemsOf=c=>(c._agenda?c.items:catTasks(c));
  const boneLenOf=c=> Math.max(150,(itemsOf(c).length+1)*gap);
  const maxBone = Math.max(150, ...cats.map(boneLenOf));
  const leftPad = btnW+stub+52;
  const W = leftPad + n*slot + headPad;
  const H = maxBone*2 + 170;
  const midY = H/2;
  const headX = W - headPad + 24;
  const o=[];
  o.push(`<svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,820)}px;width:${W}px;max-width:none;display:block;font-family:var(--sans)">`);
  o.push(`<defs><marker id="arr" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--gold)"/></marker></defs>`);
  o.push(`<line x1="30" y1="${midY}" x2="${headX-8}" y2="${midY}" stroke="var(--gold)" stroke-width="3" marker-end="url(#arr)"/>`);
  o.push(`<rect x="${headX-4}" y="${midY-44}" width="160" height="88" rx="10" fill="var(--gold)"/>`);
  o.push(`<text x="${headX+76}" y="${midY-13}" fill="#1a1208" font-size="15" font-family="var(--serif)" font-weight="700" text-anchor="middle">Journée</text>`);
  o.push(`<text x="${headX+76}" y="${midY+6}" fill="#1a1208" font-size="15" font-family="var(--serif)" font-weight="700" text-anchor="middle">exécutée</text>`);
  o.push(`<text x="${headX+76}" y="${midY+25}" fill="#1a1208" font-size="15" font-family="var(--serif)" font-weight="700" text-anchor="middle">sans faille</text>`);

  cats.forEach((c,i)=>{
    const up = i%2===0;
    const attachX = leftPad + slot*(i+0.5);
    const bl = boneLenOf(c); const dx = bl*0.5;
    const tipX = attachX - dx;
    const tipY = up ? midY-bl : midY+bl;
    const ac = roleColor(c.role);
    o.push(`<line x1="${attachX}" y1="${midY}" x2="${tipX}" y2="${tipY}" stroke="${ac}" stroke-width="2.6" opacity=".85"/>`);
    // bouton-entête du domaine (clic = zoom sur la section)
    const hw = Math.max(150,(c.label.length+5)*7.4);
    const hy = up ? tipY-32 : tipY+8;
    o.push(`<g style="cursor:pointer">`);
    o.push(`<rect x="${tipX-hw/2}" y="${hy}" width="${hw}" height="27" rx="8" fill="var(--panel2)" stroke="${ac}" stroke-width="1.5" ${c._agenda?"":`data-fbsec="${esc(c.id)}"`}/>`);
    o.push(`<text x="${tipX}" y="${hy+18}" fill="${ac}" font-size="13" font-weight="700" text-anchor="middle" pointer-events="none">${esc((c.letter?c.letter+". ":"")+c.icon+" "+c.label)}</text>`);
    o.push(`</g>`);
    // boutons sous-tâches — TOUTES affichées
    const items = itemsOf(c); const N=items.length;
    items.forEach((t,j)=>{
      const f=(j+1)/(N+1);
      const px=attachX+(tipX-attachX)*f;
      const py=midY+(tipY-midY)*f;
      const st=ts(t.id); const rc=roleColor(st.role||t.role);
      const bx=px-stub-btnW, by=py-btnH/2;
      o.push(`<line x1="${px}" y1="${py}" x2="${px-stub}" y2="${py}" stroke="${rc}" stroke-width="1.4" opacity=".7"/>`);
      const fill = st.done? "rgba(123,185,138,.13)" : "var(--panel2)";
      const stroke = st.done? "var(--green)" : rc;
      o.push(`<g style="cursor:pointer">`);
      o.push(`<rect x="${bx}" y="${by}" width="${btnW}" height="${btnH}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="1.2" ${t._event?"":`data-menu="${esc(t.id)}"`}/>`);
      o.push(`<circle cx="${bx+11}" cy="${py}" r="3.6" fill="${rc}" pointer-events="none"/>`);
      let rx = bx+btnW-9;
      if(st.done){ o.push(`<text x="${rx}" y="${py+4}" fill="var(--green)" font-size="12" font-weight="700" text-anchor="end" pointer-events="none">✓</text>`); rx-=15; }
      if(st.active){ const col=st.active==="A"?"var(--green)":"var(--red)"; o.push(`<text x="${rx}" y="${py+4}" fill="${col}" font-size="10" font-weight="700" text-anchor="end" pointer-events="none">${st.active}</text>`); rx-=14; }
      if(st.timing||t.timing){ o.push(`<text x="${rx}" y="${py+4}" fill="#c9a86a" font-size="10" text-anchor="end" pointer-events="none">⏱</text>`); rx-=14; }
      const avail=rx-(bx+20); const maxc=Math.max(6,Math.floor(avail/6.6));
      const lab=t.label.length>maxc? t.label.slice(0,maxc-1)+"…" : t.label;
      o.push(`<text x="${bx+20}" y="${py+4}" fill="var(--text)" font-size="11.5" pointer-events="none">${esc(lab)}</text>`);
      o.push(`</g>`);
    });
  });
  o.push(`</svg>`);
  return o.join("");
}

/* ===================== RENDU ===================== */
const view=document.getElementById("view");
const TABS=[["workflow","Workflow"],["daily","Daily Check"],["agent","Agent"],["repertoire","Répertoire"],["onboarding","Onboarding"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(([id,l])=>
    `<button data-tab="${id}" class="${state.tab===id?'on':''}">${l}</button>`).join("");
}
function render(){
  renderTabs();
  if(state.tab==="workflow") renderWorkflow();
  else if(state.tab==="daily") renderDaily();
  else if(state.tab==="agent") renderAgent();
  else if(state.tab==="repertoire") renderRepertoire();
  else renderOnboarding();
}
function fmtTime(iso){ if(!iso) return ""; const i=iso.indexOf("T"); if(i<0) return "journée"; return iso.slice(i+1,i+6); }
function renderWorkflow(){
  if(state.fbView!=="all" && !SECTIONS.find(s=>s.id===state.fbView)) state.fbView="all";
  const opts = `<option value="all">Vue d'ensemble</option>`+SECTIONS.map(s=>`<option value="${s.id}" ${state.fbView===s.id?"selected":""}>${s.letter}. ${esc(s.label)}</option>`).join("");
  view.innerHTML =
    `<div class="stitle">Workflow en arête de poisson — par responsable</div>
     <p class="p"><b style="color:var(--text)">Couleur = qui est en charge</b> (légende en bas). Clique un <b style="color:var(--text)">domaine</b> pour zoomer, ou une <b style="color:var(--text)">sous-tâche</b> pour ouvrir son menu. Le diagramme se nourrit du Daily Check (✓ fait, A/B plan, ⏱ délai).</p>
     <div class="fb-controls"><select class="cell" id="fbsel" style="max-width:300px">${opts}</select></div>
     <div class="fb-box">${buildFishbone(state.fbView)}</div>
     <div class="legend">
       ${Object.keys(ROLES).map(r=>`<span class="it"><span class="sw" style="background:${ROLES[r].color}"></span>${esc(ROLES[r].label)}</span>`).join("")}
       <span class="it"><span class="sw" style="background:var(--green)"></span>Fait</span>
     </div>`;
  const sel=document.getElementById("fbsel"); if(sel) sel.onchange=()=>{ state.fbView=sel.value; save(); renderWorkflow(); };

          <span><span class="sw" style="background:${roleColor(s.role)};margin-right:7px;vertical-align:middle"></span>${s.letter}. ${s.icon} ${esc(s.label)} <span class="senschip">${esc(s.sens)}</span></span>
          <button class="cat-add" data-add="${s.id}">+ Tâche</button></div>`;

      h+=`<div class="task"><div class="task-row">
          <button class="chk ${st.done?'on':''}" data-done="${esc(t.id)}">${st.done?'✓':''}</button>
          <button class="task-name ${st.done?'done':''}" data-menu="${esc(t.id)}">${esc(t.label)}</button>
          <span class="rolep" style="color:${roleColor(rl)};border-color:${roleColor(rl)}" title="${esc(roleLabel(rl))}">${esc(rl)}</span>

   <p class="p">Les personnes liées aux tâches — personnel de maison, prestataires, famille, urgences — avec leur email de contact.</p>

let editId=null;
function renderOnboarding(){
  let h=`<div class="stitle">Questions d'onboarding</div>
   <p class="p">À poser dès la première semaine. Renseigne les réponses une fois — elles deviennent ta source de vérité.</p>`;

/* ===================== ÉVÉNEMENTS ===================== */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b)return; state.tab=b.dataset.tab; save(); render();
});
view.addEventListener("click",e=>{
  const fbv=e.target.closest("[data-fbv]");
  if(fbv){ state.fbView=fbv.dataset.fbv; save(); renderWorkflow(); return; }
  const fbsec=e.target.closest("[data-fbsec]");
  if(fbsec){ state.fbView=fbsec.dataset.fbsec; save(); renderWorkflow(); return; }
  // tâche : coche rapide, ou ouverture du menu (depuis le Daily Check OU le fishbone)
  const doneBtn=e.target.closest("[data-done]");
  if(doneBtn){ const id=doneBtn.dataset.done; const st=Object.assign({done:false,active:null,note:"",owner:""},ts(id));
    st.done=!st.done; state.tasks[id]=st; save(); render(); return; }
  const menuBtn=e.target.closest("[data-menu]");
  if(menuBtn){ openTaskMenu(menuBtn.dataset.menu); return; }
  // ajout tâche custom
  const add=e.target.closest("[data-add]");
  if(add){ const key=add.dataset.add;
    const label=prompt("Nom de la nouvelle tâche :"); if(!label)return;
    const a=prompt("Plan A (nominal) :","")||""; const b=prompt("Plan B (repli) :","")||"";
    const id=`${key}-c${Date.now()}`;
    state.custom[key]=(state.custom[key]||[]).concat([{id,label,a,b}]); save(); renderDaily(); return; }
  // répertoire
  const addc=e.target.closest("#addc");
  if(addc){ const c={ id:editId||Date.now().toString(),
      name:val("f_name"),role:val("f_role"),email:val("f_email"),phone:val("f_phone"),cat:val("f_cat"),notes:val("f_notes") };
    if(!c.name.trim()&&!c.email.trim())return;
    if(editId){ state.contacts=state.contacts.map(x=>x.id===editId?c:x); editId=null; }
    else state.contacts.push(c);
    save(); renderRepertoire(); return; }
  const cancelc=e.target.closest("#cancelc"); if(cancelc){ editId=null; renderRepertoire(); return; }
  const ed=e.target.closest("[data-edit]");
  if(ed){ const c=state.contacts.find(x=>x.id===ed.dataset.edit); if(!c)return; editId=c.id; renderRepertoire();
    set("f_name",c.name);set("f_role",c.role);set("f_email",c.email);set("f_phone",c.phone);set("f_cat",c.cat);set("f_notes",c.notes);
    document.getElementById("addc").textContent="Mettre à jour"; document.getElementById("cancelc").style.display="inline-block";
    document.getElementById("rf").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const dc=e.target.closest("[data-delc]");
  if(dc){ state.contacts=state.contacts.filter(x=>x.id!==dc.dataset.delc); if(editId===dc.dataset.delc)editId=null; save(); renderRepertoire(); return; }
});
view.addEventListener("input",e=>{
  const ans=e.target.closest("[data-ans]");
  if(ans){ state.answers[ans.dataset.ans]=e.target.value; save(); return; }
});
function val(id){ const el=document.getElementById(id); return el?el.value:""; }
function set(id,v){ const el=document.getElementById(id); if(el)el.value=v||""; }

  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});

document.getElementById("rst").onclick=()=>{ if(confirm("Effacer toutes les données enregistrées ?")){ state=blank(); save(); render(); } };

/* ===================== AGENT ===================== */
function buildAgentContext(){
  let lines=[];
  SECTIONS.forEach(s=> catTasks(s).forEach(t=>{ const st=ts(t.id);
    if(st.done||st.active||st.note){
      lines.push(`[${s.letter}.${s.label}] ${t.label} (resp:${st.role||t.role}, ${t.sens})`+(st.active?` Plan ${st.active}`:"")+(st.note?` — ${st.note}`:"")+(st.done?" ✓":"")); }
  }));
  return { contacts: state.contacts.map(c=>({name:c.name,role:c.role,email:c.email,phone:c.phone,cat:c.cat})),
           tasks: lines.join("\n") };
}
function renderAgent(){
  const evs = state.agenda||[];
  const evHtml = evs.length ? evs.map(e=>`<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">
      <span style="color:var(--gold);font-weight:600;min-width:48px">${esc(fmtTime(e.start))}</span>
      <span>${esc(e.title||"")}${e.location?` <span style="color:var(--muted)">· ${esc(e.location)}</span>`:""}</span></div>`).join("")
    : `<div class="mu" style="color:var(--muted)">Aucun événement chargé. Lance la synchronisation.</div>`;
  const chatHtml = (state.chat||[]).map(m=>{
    const me=m.role==="user";
    return `<div style="display:flex;justify-content:${me?'flex-end':'flex-start'};margin:6px 0">
      <div style="max-width:80%;padding:9px 12px;border-radius:12px;font-size:13.5px;white-space:pre-wrap;
        background:${me?'var(--gold)':'var(--panel2)'};color:${me?'#1a1208':'var(--text)'};border:1px solid ${me?'var(--gold)':'var(--line)'}">${esc(m.content)}</div></div>`;
  }).join("");
  const pendHtml = (state.pending||[]).map((a,i)=>`<div style="background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:11px 13px;margin:8px 0">
      <div style="font-size:12px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:1px">Action proposée — ${esc(a.type)}</div>
      <div style="font-size:13.5px;margin:4px 0 9px">${esc(a.summary||JSON.stringify(a.params))}</div>
      <button class="btn" data-confirm="${i}" style="padding:7px 16px">Confirmer</button>
      <button class="btn ghost" data-ignore="${i}" style="padding:7px 14px;margin-left:6px">Ignorer</button>
    </div>`).join("");
  view.innerHTML =
    `<div class="stitle">Agent — agenda & outils</div>
     <p class="p">L'agent lit l'agenda du principal et propose des actions (événements, brouillons d'email). <b style="color:var(--text)">Rien n'est exécuté sans ta confirmation.</b> Backend local requis (voir CLAUDE.md).</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
       <input class="cell" id="be" style="max-width:260px" value="${esc(state.backend)}" placeholder="http://localhost:8787"/>
       <button class="btn" id="sync">Synchroniser l'agenda</button>
       <span id="status" class="mu" style="color:var(--muted);font-size:12.5px"></span>
     </div>
     <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
       <label class="toggle"><input type="checkbox" id="teamck" ${state.team?"checked":""}/> Mode équipe — écrire dans le fichier commun</label>
       <button class="btn ghost" id="pull" style="padding:6px 14px">↻ Récupérer l'équipe</button>
     </div>
     <div class="cat" style="padding:12px 14px;margin-bottom:18px"><div style="font-weight:600;margin-bottom:6px">📆 Agenda du jour</div>${evHtml}</div>
     <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px">
       <div id="chatbox" style="max-height:300px;overflow:auto;margin-bottom:10px">${chatHtml||'<div class="mu" style="color:var(--muted)">Demande par ex. « Cale un déjeuner avec le notaire jeudi 12h30 » ou « Résume mon après-midi ».</div>'}</div>
       ${pendHtml}
       <div style="display:flex;gap:8px;margin-top:8px">
         <textarea class="note" id="msg" rows="2" placeholder="Message à l'agent… (Ctrl/Cmd+Entrée pour envoyer)"></textarea>
         <button class="btn" id="send" style="white-space:nowrap">Envoyer</button>
       </div>
     </div>`;
  const be=document.getElementById("be"); be.onchange=()=>{ state.backend=be.value.trim(); save(); };
  document.getElementById("teamck").onchange=async e=>{ state.team=e.target.checked; save();
    if(state.team){ const ok=await pullState(); setStatus(ok?"Mode équipe activé — synchronisé avec le fichier commun.":"Activé (backend injoignable pour l'instant)."); }
    else setStatus("Mode équipe désactivé (modifs locales uniquement)."); };
  const pb=document.getElementById("pull"); if(pb) pb.onclick=async()=>{ const ok=await pullState(); setStatus(ok?"Récupéré depuis le fichier commun.":"Backend injoignable."); };
  document.getElementById("sync").onclick=syncAgenda;
  document.getElementById("send").onclick=sendMsg;
  document.getElementById("msg").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ sendMsg(); }});
  view.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>confirmAction(+b.dataset.confirm));
  view.querySelectorAll("[data-ignore]").forEach(b=>b.onclick=()=>{ state.pending.splice(+b.dataset.ignore,1); save(); renderAgent(); });
  const cb=document.getElementById("chatbox"); if(cb) cb.scrollTop=cb.scrollHeight;
}
function setStatus(t){ const s=document.getElementById("status"); if(s) s.textContent=t; }
async function syncAgenda(){
  setStatus("Synchronisation…");
  try{ const r=await fetch(state.backend+"/agenda"); const d=await r.json();
    if(d.ok){ state.agenda=(d.events||[]).map(e=>({title:e.title,start:e.start,end:e.end,location:e.location})); save();
      setStatus(`${state.agenda.length} événement(s) chargé(s) — visibles dans le Workflow.`); renderAgent(); }
    else setStatus("Erreur: "+(d.error||"inconnue"));
  }catch(e){ setStatus("Backend injoignable ("+state.backend+"). Lance ./run.sh."); }
}
async function sendMsg(){
  const ta=document.getElementById("msg"); const txt=(ta.value||"").trim(); if(!txt) return;
  state.chat.push({role:"user",content:txt}); state.pending=[]; save(); renderAgent();
  setStatus("L'agent réfléchit…");
  try{
    const r=await fetch(state.backend+"/chat",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ messages:state.chat.map(m=>({role:m.role,content:m.content})), context:buildAgentContext() }) });
    const d=await r.json();
    state.chat.push({role:"assistant",content:d.reply||d.error||"(réponse vide)"});
    state.pending=d.actions||[]; save(); setStatus(""); renderAgent();
  }catch(e){ state.chat.push({role:"assistant",content:"Backend injoignable. Vérifie qu'il tourne (./run.sh) et l'URL."}); save(); setStatus(""); renderAgent(); }
}
async function confirmAction(i){
  const a=state.pending[i]; if(!a) return; setStatus("Exécution…");
  try{
    const r=await fetch(state.backend+"/act",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(a) });
    const d=await r.json();
    state.pending.splice(i,1);
    state.chat.push({role:"assistant",content:(d.ok?"✓ Action exécutée : ":"✗ Échec : ")+(a.summary||a.type)+(d.error?` (${d.error})`:"")});
    save(); setStatus(""); renderAgent();
    if(d.ok && (a.type==="create_event"||a.type==="update_event")) syncAgenda();
  }catch(e){ setStatus("Backend injoignable."); }
}

/* ===================== STORE PARTAGÉ (fichier commun équipe) ===================== */
let pushT=null;
function schedulePush(){ clearTimeout(pushT); pushT=setTimeout(doPush,600); }
async function doPush(){
  try{ await fetch(state.backend+"/state",{ method:"PUT", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tasks:state.tasks,custom:state.custom,contacts:state.contacts,answers:state.answers,agenda:state.agenda}) }); }catch(e){}
}
async function pullState(){
  try{ const r=await fetch(state.backend+"/state"); const d=await r.json();
    if(d.ok&&d.state){ const s=d.state;
      if(s.tasks)state.tasks=s.tasks; if(s.custom)state.custom=s.custom; if(s.contacts)state.contacts=s.contacts;
      if(s.answers)state.answers=s.answers; if(s.agenda)state.agenda=s.agenda;
      try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} render(); return true; }
  }catch(e){} return false;
}

/* ===================== MENU SOUS-TÂCHE (popover cliquable) ===================== */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function ownerName(id){ const c=state.contacts.find(x=>x.id===id); return c? (c.name||"").split(" ")[0] : ""; }
function findTask(id){
  for(const s of SECTIONS){ const t=catTasks(s).find(x=>x.id===id); if(t) return {t, sec:s}; }
  return null;
}
function val2(id){ const el=document.getElementById(id); return el?el.value:""; }
const ov=document.getElementById("ov");
function closeMenu(){ ov.classList.remove("on"); ov.innerHTML=""; }
ov.addEventListener("click",e=>{ if(e.target===ov) closeMenu(); });

function openTaskMenu(id){
  const f=findTask(id); if(!f) return;
  const st=Object.assign({done:false,active:null,note:"",owner:"",role:f.t.role,sens:f.t.sens,timing:f.t.timing||""},ts(id));
  const isAppt=["calendrier","voyages","famille","prestataires"].includes(f.sec.id);
  const owner=state.contacts.find(c=>c.id===st.owner);
  const ownerOpts=`<option value="">— Personne assignée —</option>`+state.contacts.map(c=>`<option value="${esc(c.id)}" ${st.owner===c.id?"selected":""}>${esc(c.name)}${c.role?" · "+esc(c.role):""}</option>`).join("");
  const roleOpts=Object.keys(ROLES).map(r=>`<option value="${r}" ${(st.role)===r?"selected":""}>${r} — ${esc(ROLES[r].label)}</option>`).join("");
  const sensOpts=SENS.map(s=>`<option ${(st.sens)===s?"selected":""}>${s}</option>`).join("");
  const hasPlan = f.t.a || f.t.b;
  let act="";
  if(isAppt){
    act+=`<div class="mlab">Ajouter à l'agenda</div><div class="actbox">
      <input class="cell" id="ev_title" value="${esc(f.t.label)}" placeholder="Titre"/>
      <div class="grid2" style="margin-top:8px">
        <input class="cell" id="ev_date" type="date" value="${todayISO()}"/>
        <input class="cell" id="ev_loc" placeholder="Lieu"/>
        <input class="cell" id="ev_start" type="time" value="09:00"/>
        <input class="cell" id="ev_end" type="time" value="10:00"/>
      </div>
      <button class="btn" id="ev_add" style="margin-top:9px;padding:8px 16px">➕ Créer l'événement</button>
    </div>`;
  }
  act+=`<div class="mlab">Diffuser au responsable</div><div class="actbox">
      <div class="cap" style="margin:0 0 8px">${owner&&owner.email?`Brouillon à ${esc(owner.name)} (${esc(owner.email)}).`:`Assigne une personne avec email pour activer.`}</div>
      <button class="btn ${owner&&owner.email?"":"ghost"}" id="mail_draft" style="padding:8px 16px" ${owner&&owner.email?"":"disabled"}>✉️ Brouillon au responsable</button>
    </div>`;
  ov.innerHTML=`<div class="menu">
    <div class="mclose"><h4>${esc(f.t.label)}</h4><button id="mx">×</button></div>
    <div class="cap">${f.sec.letter}. ${esc(f.sec.label)} <span class="senschip">${esc(st.sens||f.t.sens)}</span></div>
    <div class="mrow">
      <button class="mini ${st.done?'on':''}" id="m_done">${st.done?'✓ Fait':'Marquer fait'}</button>
      <button class="mini A ${st.active==='A'?'on':''}" id="m_a">Plan A</button>
      <button class="mini B ${st.active==='B'?'on':''}" id="m_b">Plan B</button>
    </div>
    ${st.active&&hasPlan?`<div class="cap">${st.active==='A'?esc(f.t.a||""):esc(f.t.b||"")}</div>`:""}
    <div class="mlab">Responsable (rôle)</div>
    <select class="cell" id="m_role">${roleOpts}</select>
    <div class="mlab">Personne assignée (répertoire)</div>
    <select class="cell" id="m_owner">${ownerOpts}</select>
    <div class="mlab">Sensibilité</div>
    <select class="cell" id="m_sens">${sensOpts}</select>
    <div class="mlab">Note</div>
    <textarea class="note" id="m_note" rows="2" placeholder="Détail / info…">${esc(st.note)}</textarea>
    <div class="mlab">Délai / timing (tampon)</div>
    <input class="note" id="m_timing" value="${esc(st.timing)}" placeholder="ex. Réserver ≥ 48h · annulation J-1"/>
    ${act}
    ${f.t.custom?`<button class="mini" id="m_del" style="margin-top:14px;border-color:var(--red);color:var(--red)">Supprimer la tâche</button>`:""}
    <div class="cap" style="margin-top:14px">${state.team?"Mode équipe actif — diffusion vers le fichier commun (accès selon sensibilité).":"Active le mode équipe (onglet Agent) pour partager."}</div>
  </div>`;
  ov.classList.add("on");
  const set=(p)=>{ Object.assign(st,p); state.tasks[id]=st; save(); render(); openTaskMenu(id); };
  document.getElementById("mx").onclick=closeMenu;
  document.getElementById("m_done").onclick=()=>set({done:!st.done});
  document.getElementById("m_a").onclick=()=>set({active:st.active==='A'?null:'A'});
  document.getElementById("m_b").onclick=()=>set({active:st.active==='B'?null:'B'});
  document.getElementById("m_note").addEventListener("input",e=>{ st.note=e.target.value; state.tasks[id]=st; save(); });
  document.getElementById("m_timing").addEventListener("input",e=>{ st.timing=e.target.value; state.tasks[id]=st; save(); });
  document.getElementById("m_role").onchange=e=>set({role:e.target.value});
  document.getElementById("m_owner").onchange=e=>set({owner:e.target.value});
  document.getElementById("m_sens").onchange=e=>set({sens:e.target.value});
  const del=document.getElementById("m_del");
  if(del) del.onclick=()=>{ const key=f.sec.id;
    state.custom[key]=(state.custom[key]||[]).filter(x=>x.id!==id); delete state.tasks[id]; save(); closeMenu(); render(); };
  const evAdd=document.getElementById("ev_add");
  if(evAdd) evAdd.onclick=async()=>{
    const date=val2("ev_date")||todayISO(), s=val2("ev_start")||"09:00", en=val2("ev_end")||"10:00";
    const params={ title:val2("ev_title")||f.t.label, location:val2("ev_loc"), start:`${date}T${s}:00`, end:`${date}T${en}:00` };
    evAdd.textContent="…"; evAdd.disabled=true;
    try{ const r=await fetch(state.backend+"/act",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({type:"create_event",summary:params.title,params})}); const d=await r.json();
      if(d.ok){ st.note=(st.note?st.note+" · ":"")+"📆 "+s; state.tasks[id]=st; save(); syncAgenda(); closeMenu(); }
      else{ evAdd.textContent="Échec: "+(d.error||""); evAdd.disabled=false; }
    }catch(e){ evAdd.textContent="Backend injoignable"; evAdd.disabled=false; }
  };
  const md=document.getElementById("mail_draft");
  if(md) md.onclick=async()=>{
    if(!owner||!owner.email) return;
    const params={ to:[owner.email], subject:`[${f.sec.label}] ${f.t.label}`, body:`Bonjour ${owner.name},\n\nConcernant : ${f.t.label}.\n\n` };
    md.textContent="…"; md.disabled=true;
    try{ const r=await fetch(state.backend+"/act",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({type:"draft_email",summary:`Brouillon à ${owner.name}`,params})}); const d=await r.json();
      md.textContent=d.ok?"✓ Brouillon créé":"Échec: "+(d.error||""); md.disabled=false;
    }catch(e){ md.textContent="Backend injoignable"; md.disabled=false; }
  };
}

render();
if(state.team) pullState();
</script>
</body>
</html>
